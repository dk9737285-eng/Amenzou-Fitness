<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amenzou Fitness</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Montserrat', sans-serif;
    background: #0f0f0f;
    color: white;
    transition: 0.3s;
}

/* ===== NAVBAR ===== */

header {
    position: fixed;
    width: 100%;
    background: rgba(0,0,0,0.9);
    backdrop-filter: blur(10px);
    padding: 15px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 1000;
}

.logo {
    font-weight: 700;
    font-size: 20px;
    color: #ff1e1e;
}

nav button {
    background: transparent;
    border: none;
    color: white;
    margin: 0 10px;
    cursor: pointer;
    font-weight: 600;
    position: relative;
}

nav button.active::after {
    content: "";
    position: absolute;
    width: 100%;
    height: 2px;
    background: #ff1e1e;
    left: 0;
    bottom: -5px;
}

.language-btn {
    background: #ff1e1e;
    border: none;
    padding: 6px 12px;
    border-radius: 5px;
    font-weight: bold;
    cursor: pointer;
}

/* ===== SECTIONS ===== */

.section {
    min-height: 100vh;
    padding: 120px 40px 60px 40px;
    display: none;
    animation: fadeIn 0.6s ease;
}

.active-section {
    display: block;
}

@keyframes fadeIn {
    from {opacity:0; transform: translateY(20px);}
    to {opacity:1; transform: translateY(0);}
}

/* HERO */
.hero {
    background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
    url('https://images.unsplash.com/photo-1558611848-73f7eb4001a1');
    background-size: cover;
    background-position: center;
    text-align: center;
}

.hero h1 {
    font-size: 50px;
    margin-bottom: 20px;
}

.hero p {
    font-size: 18px;
    max-width: 600px;
    margin: auto;
}

/* CARDS */

.cards {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    margin-top: 40px;
}

.card {
    background: #1b1b1b;
    padding: 25px;
    border-radius: 12px;
    flex: 1 1 250px;
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-10px);
    background: #222;
    box-shadow: 0 0 20px rgba(255,0,0,0.5);
}

/* FOOTER */

footer {
    background: black;
    padding: 20px;
    text-align: center;
}

/* RESPONSIVE */

@media(max-width:768px){
    header {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">💪 Amenzou Fitness</div>

    <nav>
        <button onclick="showSection('home')" id="nav-home">Home</button>
        <button onclick="showSection('programs')" id="nav-programs">Programs</button>
        <button onclick="showSection('pricing')" id="nav-pricing">Pricing</button>
        <button onclick="showSection('contact')" id="nav-contact">Contact</button>
    </nav>

    <button class="language-btn" onclick="toggleLanguage()" id="lang-btn">AR</button>
</header>

<!-- HERO -->
<section id="home" class="section hero active-section">
    <h1 id="home-title"></h1>
    <p id="home-text"></p>
</section>

<!-- PROGRAMS -->
<section id="programs" class="section">
    <h2 id="programs-title"></h2>
    <div class="cards">
        <div class="card"><h3>💪 Bodybuilding</h3></div>
        <div class="card"><h3>🔥 CrossFit</h3></div>
        <div class="card"><h3>🏃 Cardio</h3></div>
        <div class="card"><h3>🥗 Nutrition</h3></div>
    </div>
</section>

<!-- PRICING -->
<section id="pricing" class="section">
    <h2 id="pricing-title"></h2>
    <div class="cards">
        <div class="card"><h3>Basic</h3><p>$25</p></div>
        <div class="card"><h3>Standard</h3><p>$40</p></div>
        <div class="card"><h3>Premium</h3><p>$60</p></div>
    </div>
</section>

<!-- CONTACT -->
<section id="contact" class="section">
    <h2 id="contact-title"></h2>
    <p id="contact-text"></p>
</section>

<footer id="footer-text"></footer>

<script>
let currentLang = localStorage.getItem("lang") || "en";

const translations = {
    en: {
        btn:"AR",
        navHome:"Home",
        navPrograms:"Programs",
        navPricing:"Pricing",
        navContact:"Contact",
        homeTitle:"Train Hard. Stay Strong.",
        homeText:"Welcome to Amenzou Fitness. Your transformation starts today.",
        programsTitle:"Our Programs",
        pricingTitle:"Membership Plans",
        contactTitle:"Contact Us",
        contactText:"info@amenzoufitness.com | +212 600 000 000",
        footer:"© 2026 Amenzou Fitness"
    },
    ar: {
        btn:"FR",
        navHome:"الرئيسية",
        navPrograms:"البرامج",
        navPricing:"الأسعار",
        navContact:"اتصل بنا",
        homeTitle:"تدرّب بقوة وابقَ قوياً",
        homeText:"مرحباً بكم في أمينزو فيتنس. رحلتك تبدأ اليوم.",
        programsTitle:"برامجنا",
        pricingTitle:"خطط الاشتراك",
        contactTitle:"اتصل بنا",
        contactText:"info@amenzoufitness.com | +212 600 000 000",
        footer:"© 2026 أمينزو فيتنس"
    },
    fr: {
        btn:"EN",
        navHome:"Accueil",
        navPrograms:"Programmes",
        navPricing:"Tarifs",
        navContact:"Contact",
        homeTitle:"Entraînez-vous dur. Restez fort.",
        homeText:"Bienvenue à Amenzou Fitness. Votre transformation commence aujourd'hui.",
        programsTitle:"Nos Programmes",
        pricingTitle:"Plans d'abonnement",
        contactTitle:"Contactez-nous",
        contactText:"info@amenzoufitness.com | +212 600 000 000",
        footer:"© 2026 Amenzou Fitness"
    }
};

function applyLanguage(){
    const t = translations[currentLang];

    document.getElementById("nav-home").innerText = t.navHome;
    document.getElementById("nav-programs").innerText = t.navPrograms;
    document.getElementById("nav-pricing").innerText = t.navPricing;
    document.getElementById("nav-contact").innerText = t.navContact;

    document.getElementById("home-title").innerText = t.homeTitle;
    document.getElementById("home-text").innerText = t.homeText;

    document.getElementById("programs-title").innerText = t.programsTitle;
    document.getElementById("pricing-title").innerText = t.pricingTitle;
    document.getElementById("contact-title").innerText = t.contactTitle;
    document.getElementById("contact-text").innerText = t.contactText;
    document.getElementById("footer-text").innerText = t.footer;

    document.getElementById("lang-btn").innerText = t.btn;

    document.body.dir = currentLang === "ar" ? "rtl" : "ltr";

    localStorage.setItem("lang", currentLang);
}

function toggleLanguage(){
    if(currentLang==="en") currentLang="ar";
    else if(currentLang==="ar") currentLang="fr";
    else currentLang="en";
    applyLanguage();
}

function showSection(id){
    document.querySelectorAll(".section").forEach(sec=>{
        sec.classList.remove("active-section");
    });

    document.querySelectorAll("nav button").forEach(btn=>{
        btn.classList.remove("active");
    });

    document.getElementById(id).classList.add("active-section");
    document.getElementById("nav-"+id).classList.add("active");
}

applyLanguage();
</script>

</body>
</html>
